[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chameleon"
version = "2.0.0"
description = "AI-Assisted Adaptive Malware Analysis and Morphing Engine - Blue Team Analysis Engine with Red Team Evasion Module"
readme = "readme.md"
requires-python = ">=3.10"
authors = [
    { name = "Chameleon Team", email = "team@chameleon.local" },
]
keywords = ["malware-analysis", "cybersecurity", "ai", "ml", "threat-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "W", "E9", "F", "B", "I"]
ignore = ["E203", "B008"]
extend-select = ["I"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(\n  # directories\n  \.eggs\n  | \.git\n  | \.hg\n  | \.mypy_cache\n  | \.tox\n  | \.venv\n  | build\n  | dist\n)/
'''  
